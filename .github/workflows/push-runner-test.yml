name: Push Runner Test

on:
  push:

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public runner diagnostics
        run: |
          echo "=== PUSH RUNNER TEST ==="
          echo "STATUS=START"
          echo "UTC: $(date -u)"
          echo "OS: $RUNNER_OS"
          echo "ARCH: $RUNNER_ARCH"
          echo "CPU: $(nproc)"
          echo "MEMORY:"
          free -h
          echo "DISK:"
          df -h / | tail -n 1
          sleep 30
          echo "STATUS=PASS"
